apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: task-api-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nilay-pagnis/aks-helm-cicd-platform.git
    targetRevision: main
    path: charts/task-api
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: task-api-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
